<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙語歌唱與朗讀自主學習助手</title>
    <!-- Google Fonts: Outfit & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f5f6f8;
            --text-muted: #8b949e;
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.15);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --active-glow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at 50% 50%, #151726 0%, #08090d 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* Glassmorphism Wrapper */
        .app-container {
            width: 100%;
            max-width: 960px;
            background: rgba(18, 20, 32, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), var(--accent-glow);
            padding: 2.5rem;
            transition: all 0.4s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Song Selector Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem 1.6rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        /* Dashboard & Controls */
        .control-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
            justify-content: space-between;
        }

        .desc-section {
            flex: 1 1 300px;
        }

        .song-title-display {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #fff;
        }

        .song-desc-display {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .action-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }

        .btn-play-all {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #fff;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .btn-play-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #3b37c4 100%);
        }

        .btn-play-all.playing {
            background: #ef4444;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-play-all.playing:hover {
            background: #dc2626;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .slider-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .slider-label span {
            color: var(--text-main);
            font-weight: 600;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 160px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Practice Status Bar */
        .status-bar {
            width: 100%;
            margin-top: 1rem;
            padding: 0.8rem 1.2rem;
            background: rgba(99, 102, 241, 0.05);
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .status-txt {
            font-weight: 500;
        }

        .status-txt span {
            color: #818cf8;
            font-weight: 700;
        }

        .progress-ring-container {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Lyrics Sheet */
        .lyrics-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .lyric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .lyric-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: transparent;
            transition: background 0.3s ease;
        }

        .lyric-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(5px);
        }

        .lyric-card.active {
            background: rgba(99, 102, 241, 0.06);
            border-color: var(--primary);
            box-shadow: var(--active-glow);
        }

        .lyric-card.active::before {
            background: var(--primary);
        }

        .lyric-num {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 24px;
            text-align: center;
        }

        .lyric-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .lyric-original {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-speak-icon {
            opacity: 0.3;
            transition: opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
        }

        .lyric-card:hover .btn-speak-icon,
        .lyric-card.active .btn-speak-icon {
            opacity: 1;
            color: #818cf8;
        }

        .lyric-translation {
            font-size: 1.05rem;
            color: #a5b4fc;
        }

        .lyric-pho {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .pho-ipa {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pho-pinyin {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.04);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(239, 68, 68, 0.08);
        }

        /* Repeat Status Animation Overlay */
        .repeat-overlay {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lyric-card.repeating .repeat-overlay {
            opacity: 1;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        /* SVG icons */
        svg {
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>雙語歌唱與朗讀自主學習助手</h1>
        <div class="subtitle">Bilingual Singing & Pronunciation Practice Assistant</div>
    </header>

    <!-- Song Selector Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchSong('ag')">Amazing Grace</button>
        <button class="tab-btn" onclick="switchSong('sg')">The Salley Gardens</button>
        <button class="tab-btn" onclick="switchSong('sl')">Santa Lucia</button>
    </div>

    <!-- Song Details & Controls -->
    <div class="control-panel">
        <div class="desc-section">
            <div class="song-title-display" id="song-title">Amazing Grace (奇異恩典)</div>
            <div class="song-desc-display" id="song-desc">英國經典聖詩，感人至深的救贖與恩典之歌。</div>
        </div>
        <div class="action-section">
            <!-- Pause slider -->
            <div class="slider-container">
                <div class="slider-label">跟讀停頓時間: <span id="pause-val">3.5秒</span></div>
                <input type="range" id="pause-slider" min="2" max="8" step="0.5" value="3.5" oninput="updatePauseVal(this.value)">
            </div>
            <!-- Play All / Practice button -->
            <button class="btn-play-all" id="btn-practice" onclick="togglePracticeMode()">
                <svg width="20" height="20" viewBox="0 0 24 24" id="play-icon">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span id="btn-text">開始連唱練習</span>
            </button>
        </div>

        <!-- Status display -->
        <div class="status-bar" id="status-bar" style="display:none;">
            <div class="status-txt" id="status-txt">狀態：準備中...</div>
            <div class="progress-ring-container" id="countdown-txt"></div>
        </div>
    </div>

    <!-- Lyrics Sheet -->
    <div class="lyrics-container" id="lyrics-sheet">
        <!-- Rendered dynamically by JavaScript -->
    </div>
</div>

<footer>
    本系統音檔儲存於本地 <span style="font-family: monospace;">audio/</span> 資料夾，配合網頁點選可立即播放。
</footer>

<!-- Single HTML5 Audio Element for Playback -->
<audio id="audio-player"></audio>

<script>
    // Song database
    const songs = {
        ag: {
            title: "Amazing Grace (奇異恩典)",
            desc: "詞：約翰·牛頓 (John Newton) | 英國經典聖詩，感人至深的救贖與恩典之歌。",
            lines: [
                { text: "Amazing grace! How sweet the sound", translation: "奇異恩典！何等甘甜的歌聲", ipa: "[əˈmeɪzɪŋ ɡreɪs / haʊ swiːt ðə saʊnd]", pinyin: "阿妹晶 葛雷斯！豪 絲威特 德 桑德", audio: "audio/ag_1.mp3" },
                { text: "That saved a wretch like me!", translation: "拯救了像我這樣一個無用的人！", ipa: "[ðæt seɪvd ə retʃ laɪk miː]", pinyin: "德特 誰夫德 額 瑞奇 賴克 密！", audio: "audio/ag_2.mp3" },
                { text: "I once was lost, but now am found;", translation: "我曾迷失，如今已被尋回；", ipa: "[aɪ wʌns wɒz lɒst / bʌt naʊ æm faʊnd]", pinyin: "愛 望斯 瓦茲 羅斯特，霸特 鬧 誒姆 芳德；", audio: "audio/ag_3.mp3" },
                { text: "Was blind, but now I see.", translation: "曾經盲目，如今終得看見。", ipa: "[wɒz blaɪnd / bʌt naʊ aɪ siː]", pinyin: "瓦茲 布賴恩德，霸特 鬧 愛 係。", audio: "audio/ag_4.mp3" },
                { text: "'Twas grace that taught my heart to fear,", translation: "是恩典教導我的心敬畏，", ipa: "[twɒz ɡreɪs ðæt tɔːt maɪ hɑːt tuː fɪə]", pinyin: "特瓦茲 葛雷斯 德特 討特 麥 哈特 吐 飛兒", audio: "audio/ag_5.mp3" },
                { text: "And grace my fears relieved;", translation: "也是恩典釋放了我的恐懼；", ipa: "[ænd ɡreɪs maɪ fɪəz rɪˈliːvd]", pinyin: "安德 葛雷斯 麥 飛兒茲 瑞利夫德；", audio: "audio/ag_6.mp3" },
                { text: "How precious did that grace appear", translation: "這恩典顯得何等珍貴，", ipa: "[haʊ ˈpreʃəs dɪd ðæt ɡreɪs əˈpɪə]", pinyin: "豪 普瑞夏斯 迪德 德特 葛雷斯 額批兒", audio: "audio/ag_7.mp3" },
                { text: "The hour I first believed.", translation: "在我初信的那一刻。", ipa: "[ðiː ˈaʊə aɪ fɜːst bɪˈliːvd]", pinyin: "德 奧兒 愛 佛斯特 逼利夫德。", audio: "audio/ag_8.mp3" },
                { text: "Through many dangers, toils and snares,", translation: "歷經無數險阻、艱辛與網羅，", ipa: "[θruː ˈmeni ˈdeɪndʒəz / tɔɪlz ænd sneəz]", pinyin: "思路 妹尼 頂者茲 / 偷意爾茲 恩德 絲內兒茲", audio: "audio/ag_9.mp3" },
                { text: "I have already come;", translation: "我已安然度過；", ipa: "[aɪ hæv ɔːlˈredi kʌm]", pinyin: "愛 漢夫 歐瑞迪 康；", audio: "audio/ag_10.mp3" },
                { text: "'Tis grace hath brought me safe thus far,", translation: "是恩典帶領我平安走到如今，", ipa: "[tɪz ɡreɪs hæθ brɔːt miː seɪf ðʌs fɑː]", pinyin: "特意茲 葛雷斯 哈思 不若特 密 誰夫 達斯 法兒", audio: "audio/ag_11.mp3" },
                { text: "And grace will lead me home.", translation: "恩典也將帶領我回到天家。", ipa: "[ænd ɡreɪs wɪl liːd miː həʊm]", pinyin: "安德 葛雷斯 威爾 利德 密 吼姆。", audio: "audio/ag_12.mp3" },
                { text: "When we've been there ten thousand years,", translation: "當我們在那裡度過一萬年，", ipa: "[wen wiːv biːn ðeə ten ˈθaʊzənd jɪəz]", pinyin: "溫 威夫 賓 德兒 顛 哨森德 意兒茲", audio: "audio/ag_13.mp3" },
                { text: "Bright shining as the sun,", translation: "如太陽般耀眼奪目，", ipa: "[braɪt ˈʃaɪnɪŋ æz ðə sʌn]", pinyin: "不賴特 曬寧 誒茲 德 傘", audio: "audio/ag_14.mp3" },
                { text: "We've no less days to sing God's praise", translation: "我們仍有無限歲月歌頌上帝的讚美，", ipa: "[wiːv nəʊ les deɪz tuː sɪŋ ɡɒdz preɪz]", pinyin: "威夫 弄 萊斯 頂茲 吐 頂 嘎茲 普瑞茲", audio: "audio/ag_15.mp3" },
                { text: "Than when we first begun.", translation: "就像我們最初開始的那天一樣。", ipa: "[ðæn wen wiː fɜːst bɪˈɡʌn]", pinyin: "丹 溫 威 佛斯特 逼甘。", audio: "audio/ag_16.mp3" }
            ]
        },
        sg: {
            title: "Down by the Salley Gardens (莎莉花園深處)",
            desc: "詞：威廉·巴特勒·葉慈 (W. B. Yeats) | 優美而帶有年少悔恨的愛爾蘭民謠經典。",
            lines: [
                { text: "Down by the salley gardens my love and I did meet;", translation: "在柳樹園的深處，我和我的愛人相遇；", ipa: "[daʊn baɪ ðə ˈsæli ˈɡɑːdənz / maɪ lʌv ænd aɪ dɪd miːt]", pinyin: "當 拜 德 薩利 嘎登茲 / 麥 拉夫 恩德 愛 迪德 密特", audio: "audio/sg_1.mp3" },
                { text: "She passed the salley gardens with little snow-white feet.", translation: "她邁著雪白的小腳，走過柳樹園。", ipa: "[ʃiː pɑːst ðə ˈsæli ˈɡɑːdənz / wɪð ˈlɪtəl snəʊ-waɪt fiːt]", pinyin: "係 帕斯特 德 薩利 嘎登茲 / 威茲 麗特 斯諾-歪特 費特", audio: "audio/sg_2.mp3" },
                { text: "She bid me take love easy, as the leaves grow on the tree;", translation: "她勸我對戀愛抱持淡然的態度，就像樹上長出綠葉那樣自然；", ipa: "[ʃiː bɪd miː teɪk lʌv ˈiːzi / æz ðə liːvz ɡrəʊ ɒn ðə triː]", pinyin: "係 必得 密 帖克 拉夫 意吉 / 誒茲 德 麗夫茲 歌肉 昂 德 區", audio: "audio/sg_3.mp3" },
                { text: "But I, being young and foolish, with her would not agree.", translation: "但那時的我年輕愚蠢，不肯聽從她的勸告。", ipa: "[bʌt aɪ / ˈbiːɪŋ jʌŋ ænd ˈfuːlɪʃ / wɪð hɜː wʊd nɒt əˈɡriː]", pinyin: "霸特 愛 / 逼硬 樣 恩德 夫利許 / 威茲 赫 伍德 那特 阿葛綠", audio: "audio/sg_4.mp3" },
                { text: "In a field by the river my love and I did stand,", translation: "在河畔的一片草地上，我和我的愛人並肩站立，", ipa: "[ɪn ə fiːld baɪ ðə ˈrɪvə / maɪ lʌv ænd aɪ dɪd stænd]", pinyin: "印 額 菲爾德 拜 德 瑞佛 / 麥 拉夫 恩德 愛 迪德 絲丹德", audio: "audio/sg_5.mp3" },
                { text: "And on my leaning shoulder she laid her snow-white hand.", translation: "她將雪白的手輕輕搭在我傾斜的肩頭。", ipa: "[ænd ɒn maɪ ˈliːnɪŋ ˈʃəʊldə / ʃiː leɪd hɜː snəʊ-waɪt hænd]", pinyin: "安德 昂 麥 離寧 秀德 / 係 累德 赫 斯諾-歪特 漢德", audio: "audio/sg_6.mp3" },
                { text: "She bid me take life easy, as the grass grows on the weirs;", translation: "她勸我對生活隨遇而安，就像堰壩上生長的青草那樣泰然；", ipa: "[ʃiː bɪd miː teɪk laɪf ˈiːzi / æz ðə ɡrɑːs ɡrəʊz ɒn ðə wɪəz]", pinyin: "係 必得 密 帖克 賴夫 意吉 / 誒茲 德 葛拉斯 歌肉茲 昂 德 威兒茲", audio: "audio/sg_7.mp3" },
                { text: "But I was young and foolish, and now am full of tears.", translation: "但那時的我年輕愚蠢，而如今我淚流滿面。", ipa: "[bʌt aɪ wɒz jʌŋ ænd ˈfuːlɪʃ / ænd naʊ æm fʊl ɒv tɪəz]", pinyin: "霸特 愛 瓦茲 樣 恩德 夫利許 / 恩德 鬧 誒姆 夫爾 歐夫 梯兒茲", audio: "audio/sg_8.mp3" }
            ]
        },
        sl: {
            title: "Santa Lucia (桑塔露琪亞)",
            desc: "原詞：特奧多羅·科特勞 (Teodoro Cottrau) | 經典義大利拿坡里船歌，陽溢地中海月光與波浪搖曳風情。",
            lines: [
                { text: "Sul mare luccica l’astro d’argento.", translation: "銀色的月星在海面上閃爍。", ipa: "[sul ˈmaːre ˈluttʃika ˈlastro darˈdʒɛnto]", pinyin: "蘇爾 媽雷 綠七卡 拉斯脫 達爾健脫", audio: "audio/sl_1.mp3" },
                { text: "Placida è l’onda, prospero è il vento.", translation: "微波粼粼，風兒和煦。", ipa: "[ˈplatʃida ˈɛ ˈlonda / ˈprɔspero ˈɛ il ˈvento]", pinyin: "鋪拉七達 誒 隆達，鋪若斯陪若 誒 意爾 溫脫", audio: "audio/sl_2.mp3" },
                { text: "Venite all’agile barchetta mia,", translation: "快來坐上我這輕巧的小船吧，", ipa: "[veˈniːte alˈlaːdʒile barˈketta ˈmiːa]", pinyin: "微尼帖 阿拉吉雷 巴爾科特塔 咪啊", audio: "audio/sl_3.mp3" },
                { text: "Santa Lucia! Santa Lucia!", translation: "桑塔露琪亞！桑塔露琪亞！", ipa: "[ˈsanta luˈtʃiːa / ˈsanta luˈtʃiːa]", pinyin: "桑塔 露琪亞！桑塔 露琪亞！", audio: "audio/sl_4.mp3" },
                { text: "Con questo zeffiro così soave,", translation: "伴著這般溫柔和煦的微風，", ipa: "[kon ˈkwesto ˈdzɛffiro koˈzi soˈaːve]", pinyin: "空 虧斯脫 ㄗㄟ飛若 扣吉 索阿微", audio: "audio/sl_5.mp3" },
                { text: "Oh, com’è bello star sulla nave!", translation: "啊！在船上乘風破浪是多麼愜意！", ipa: "[ɔ / koˈmɛ bˈbɛllo ˈstar ˈsulla ˈnaːve]", pinyin: "喔，扣美 貝羅 絲達爾 蘇拉 納微", audio: "audio/sl_6.mp3" },
                { text: "Su passeggeri, venite via!", translation: "乘客們，快動身出發吧！", ipa: "[su passeaˈdʒɛːri / veˈniːte ˈviːa]", pinyin: "蘇 趴塞健里，微尼帖 菲亞", audio: "audio/sl_7.mp3" },
                { text: "Santa Lucia! Santa Lucia!", translation: "桑塔露琪亞！桑塔露琪亞！", ipa: "[ˈsanta luˈtʃiːa / ˈsanta luˈtʃiːa]", pinyin: "桑塔 露琪亞！桑塔 露琪亞！", audio: "audio/sl_8.mp3" }
            ]
        }
    };

    let currentSongId = "ag";
    let activeLineIndex = -1;
    let isPracticeMode = false;
    let pauseDuration = 3.5; // seconds
    let repeatTimer = null;
    let countdownInterval = null;

    const audioPlayer = document.getElementById("audio-player");
    const playIcon = `
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    `;
    const stopIcon = `
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    `;

    // Initialize Page
    window.addEventListener("DOMContentLoaded", () => {
        renderLyrics(currentSongId);
        updatePauseVal(3.5);
        
        // Handle audio events
        audioPlayer.addEventListener("ended", onAudioEnded);
        audioPlayer.addEventListener("error", () => {
            updateStatus("⚠️ 音檔加載失敗，請確認音檔位於正確資料夾中。", false);
            stopPractice();
        });
    });

    // Render lyrics lists
    function renderLyrics(songId) {
        const sheet = document.getElementById("lyrics-sheet");
        sheet.innerHTML = "";
        
        const lines = songs[songId].lines;
        lines.forEach((line, index) => {
            const card = document.createElement("div");
            card.className = "lyric-card";
            card.id = `lyric-${index}`;
            card.onclick = () => playSingleLine(index);

            card.innerHTML = `
                <div class="lyric-num">${index + 1}</div>
                <div class="lyric-body">
                    <div class="lyric-original">
                        <span>${line.text}</span>
                        <span class="btn-speak-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                        </span>
                    </div>
                    <div class="lyric-translation">${line.translation}</div>
                    <div class="lyric-pho">
                        <span class="pho-ipa">${line.ipa}</span>
                        <span class="pho-pinyin">${line.pinyin}</span>
                    </div>
                </div>
                <!-- Repeating Indicator -->
                <div class="repeat-overlay">
                    <div class="pulse-dot"></div>
                    <span>跟讀中...</span>
                </div>
            `;
            sheet.appendChild(card);
        });
    }

    // Switch songs
    function switchSong(songId) {
        if (songId === currentSongId) return;
        
        stopPractice();
        currentSongId = songId;
        
        // Update tabs active state
        const tabBtns = document.querySelectorAll(".tab-btn");
        tabBtns.forEach(btn => btn.classList.remove("active"));
        event.target.classList.add("active");
        
        // Update header details
        document.getElementById("song-title").innerText = songs[songId].title;
        document.getElementById("song-desc").innerText = songs[songId].desc;
        
        renderLyrics(songId);
    }

    // Update pause label
    function updatePauseVal(val) {
        pauseDuration = parseFloat(val);
        document.getElementById("pause-val").innerText = val + "秒";
    }

    // Play a single line (when clicked)
    function playSingleLine(index) {
        if (isPracticeMode) {
            stopPractice();
        }
        
        highlightLine(index);
        playAudio(songs[currentSongId].lines[index].audio);
        updateStatus(`正在播放第 ${index + 1} 句...`, true);
    }

    // Play specific audio path
    function playAudio(path) {
        audioPlayer.src = path;
        audioPlayer.play().catch(err => {
            console.error("Audio playback error:", err);
            updateStatus("⚠️ 音檔加載出錯，請檢查本機音檔路徑是否正確。", false);
        });
    }

    // Handle end of audio playback
    function onAudioEnded() {
        if (!isPracticeMode) {
            // In click-to-play mode, just de-highlight when done
            setTimeout(() => {
                dehighlightAll();
                updateStatus("已暫停", false);
            }, 500);
            return;
        }

        // In practice mode, transition to "Repeat / Silence" state
        startRepeatPhase();
    }

    // Start repeating phase with countdown
    function startRepeatPhase() {
        const activeCard = document.getElementById(`lyric-${activeLineIndex}`);
        if (activeCard) {
            activeCard.classList.remove("active");
            activeCard.classList.add("repeating");
        }
        
        let timeLeft = pauseDuration;
        updateStatus(`請跟讀第 ${activeLineIndex + 1} 句...`, true);
        updateCountdown(timeLeft);

        countdownInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
            } else {
                updateCountdown(timeLeft);
            }
        }, 100);

        repeatTimer = setTimeout(() => {
            if (activeCard) {
                activeCard.classList.remove("repeating");
            }
            clearInterval(countdownInterval);
            
            // Advance to next line
            activeLineIndex++;
            if (activeLineIndex >= songs[currentSongId].lines.length) {
                // Song finished
                updateStatus("🎉 練習結束！太棒了！", true);
                stopPractice();
            } else {
                playNextPracticeLine();
            }
        }, pauseDuration * 1000);
    }

    // Play next line in practice queue
    function playNextPracticeLine() {
        highlightLine(activeLineIndex);
        updateStatus(`正在播放第 ${activeLineIndex + 1} 句...`, true);
        document.getElementById("countdown-txt").innerText = "🔊 播放中...";
        playAudio(songs[currentSongId].lines[activeLineIndex].audio);
    }

    // Start/Stop full practice mode
    function togglePracticeMode() {
        if (isPracticeMode) {
            stopPractice();
        } else {
            startPractice();
        }
    }

    function startPractice() {
        isPracticeMode = true;
        activeLineIndex = 0;
        
        const btn = document.getElementById("btn-practice");
        btn.innerHTML = `${stopIcon} <span>停止練習</span>`;
        btn.classList.add("playing");
        
        document.getElementById("status-bar").style.display = "flex";
        
        playNextPracticeLine();
    }

    function stopPractice() {
        isPracticeMode = false;
        audioPlayer.pause();
        
        // Clear all timers
        clearTimeout(repeatTimer);
        clearInterval(countdownInterval);
        
        dehighlightAll();
        
        const btn = document.getElementById("btn-practice");
        btn.innerHTML = `${playIcon} <span>開始連唱練習</span>`;
        btn.classList.remove("playing");
        
        document.getElementById("status-bar").style.display = "none";
        activeLineIndex = -1;
    }

    // UI Helpers
    function highlightLine(index) {
        dehighlightAll();
        const card = document.getElementById(`lyric-${index}`);
        if (card) {
            card.classList.add("active");
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function dehighlightAll() {
        const cards = document.querySelectorAll(".lyric-card");
        cards.forEach(card => {
            card.classList.remove("active");
            card.classList.remove("repeating");
        });
    }

    function updateStatus(txt, isInfo) {
        const bar = document.getElementById("status-bar");
        const txtEl = document.getElementById("status-txt");
        txtEl.innerText = txt;
    }

    function updateCountdown(seconds) {
        document.getElementById("countdown-txt").innerText = `🎤 請跟讀... (${seconds.toFixed(1)}秒)`;
    }
</script>
</body>
</html>
